packages:
  - 'apps/*'

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  bufferutil: true
  es5-ext: true
  esbuild: true
  prisma: true
  utf-8-validate: true

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - 'esbuild'
  - 'prisma'
