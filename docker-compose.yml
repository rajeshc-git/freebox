
services:
  # Redis Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: freebox-redis
    command: redis-server --appendonly yes --maxmemory 30mb --maxmemory-policy volatile-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 50M

  # Server API Service (internal port 5005, RAM: ~54MB)
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: freebox-server
    environment:
      PORT: 5005
      DATABASE_URL: "file:/app/data/dev.db"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
    depends_on:
      - redis
    volumes:
      - server-data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 500M

  # Frontend + Nginx reverse proxy (single public port 5004)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: freebox-web
    ports:
      - "5004:5004"
    depends_on:
      - server
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 100M

volumes:
  redis-data:
  server-data:
