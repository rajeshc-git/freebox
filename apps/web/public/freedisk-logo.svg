      <stop offset="0%" stop-color="#00A3FF"/>
      <stop offset="50%" stop-color="#2481CC"/>
      <stop offset="100%" stop-color="#185A9D"/>
    </linearGradient>
    <linearGradient id="fbBoxLid" x1="8" y1="8" x2="32" y2="24" gradientUnits="userSpaceOnUse">
